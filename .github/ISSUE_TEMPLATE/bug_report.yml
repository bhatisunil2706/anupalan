name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. For a **security vulnerability**, don't use this form: report it privately from the Security tab."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v0.5 or the commit hash
  - type: dropdown
    id: setup
    attributes:
      label: How are you running Pramaanly?
      options: ["Docker (start.sh / docker compose)", "Production compose", "Local development", "Live demo site", "Other"]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove any secrets or personal data before pasting.
      render: shell
