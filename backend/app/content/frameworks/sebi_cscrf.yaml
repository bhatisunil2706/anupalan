# SEBI Cybersecurity and Cyber Resilience Framework (CSCRF) for SEBI Regulated Entities, circular of 20 August 2024
# (with later clarifications). Topic references are in-house groupings by function, not the circular's numbering.
# Many requirements vary by RE category (MII, Qualified, Mid-size, Small-size, Self-certification).
# CONTENT STATUS: draft. Check category-specific requirements and timelines in the circular before release.
code: sebi_cscrf
name: SEBI Cybersecurity and Cyber Resilience Framework (CSCRF)
short_name: SEBI CSCRF
version: "2024"
region: India
publisher: Securities and Exchange Board of India
source_url: https://www.sebi.gov.in/legal/circulars/aug-2024/cybersecurity-and-cyber-resilience-framework-cscrf-for-sebi-regulated-entities-res-_85964.html
content_version: "0.1.0"
review_status: draft
description: >
  Replaces earlier SEBI cyber circulars for stock brokers, depository participants, mutual funds, AMCs,
  KRAs, RTAs, portfolio managers, AIFs and market infrastructure institutions. Organised by the NIST CSF
  functions plus "Evolve". Requirements scale with the RE category; ISO 27001 certification, the Cyber
  Capability Index and red teaming apply to MIIs and Qualified REs.
requirements:
  # ---- Governance ----
  - {ref: "GV.1", section: "Governance", title: "Board-approved cybersecurity and cyber resilience policy", guidance: "Adopt a cybersecurity and cyber resilience policy approved by the Board (or partners/proprietor) and review it at least annually.", controls: [GOV-01, GOV-18]}
  - {ref: "GV.2", section: "Governance", title: "CISO and IT committee", guidance: "Designate a CISO (or a designated officer for smaller REs) and an IT committee that oversees cyber risk.", controls: [GOV-04, GOV-18]}
  - {ref: "GV.3", section: "Governance", title: "Cyber risk management framework", guidance: "Identify, evaluate, prioritise, respond to and monitor cyber risks continuously (MII, Qualified and Mid-size REs).", controls: [RISK-01, RISK-02]}
  - {ref: "GV.4", section: "Governance", title: "Third-party and supply chain risk", guidance: "Assess vendors and service providers, put security and audit rights in contracts, and keep a software bill of materials for critical systems.", controls: [VEN-01, VEN-02, SDL-03]}
  - {ref: "GV.5", section: "Governance", title: "ISO 27001 certification", guidance: "MIIs and Qualified REs maintain ISO/IEC 27001 certification.", controls: [GOV-02, GOV-13]}
  # ---- Identify ----
  - {ref: "ID.1", section: "Identify", title: "Inventory and classification of critical systems", guidance: "Keep an inventory of IT assets, classify critical systems and data, and keep it current.", controls: [AST-01, AST-03]}
  - {ref: "ID.2", section: "Identify", title: "Periodic risk assessment and scenario testing", guidance: "Assess risks to critical systems, including scenario-based tests of internal and external threats.", controls: [RISK-01, RISK-05]}
  # ---- Protect ----
  - {ref: "PR.1", section: "Protect", title: "Access control and authentication", guidance: "Document access policies, apply least privilege, use MFA for critical and remote access, and review access periodically.", controls: [ACC-01, ACC-03, ACC-04, ACC-05]}
  - {ref: "PR.2", section: "Protect", title: "Data protection and encryption", guidance: "Encrypt data at rest and in transit (layered full-disk and file-level encryption), and keep regulated data within India as SEBI requires.", controls: [CRY-01, NET-02, PRV-13]}
  - {ref: "PR.3", section: "Protect", title: "Network segmentation and secure configuration", guidance: "Segment networks, harden systems and restrict internet-facing services.", controls: [NET-01, OPS-04]}
  - {ref: "PR.4", section: "Protect", title: "Application and API security", guidance: "Separate production from non-production, review code, and secure APIs with authentication, authorisation, rate limiting and throttling.", controls: [SDL-01, SDL-04, NET-01]}
  - {ref: "PR.5", section: "Protect", title: "Endpoint security and patching", guidance: "Protect endpoints with anti-malware or EDR and patch on a risk-based schedule.", controls: [AST-05, OPS-01, OPS-02]}
  - {ref: "PR.6", section: "Protect", title: "Logging and log retention", guidance: "Collect logs from critical systems and keep them for the period SEBI and CERT-In require (at least 180 days in India).", controls: [LOG-01, LOG-03]}
  - {ref: "PR.7", section: "Protect", title: "Training and awareness", guidance: "Train staff and management on cyber risks at least annually.", controls: [HR-03]}
  # ---- Detect ----
  - {ref: "DE.1", section: "Detect", title: "Security Operations Centre", guidance: "Monitor continuously through a SOC (own, group or third party); smaller REs onboard to the Market SOC run by the exchanges. Measure SOC efficacy periodically.", controls: [LOG-02]}
  - {ref: "DE.2", section: "Detect", title: "Vulnerability assessment and penetration testing", guidance: "Run VAPT on critical systems and internet-facing infrastructure through a CERT-In empanelled auditor, and fix findings within set timelines.", controls: [OPS-02, OPS-03]}
  - {ref: "DE.3", section: "Detect", title: "Red teaming", guidance: "MIIs and Qualified REs run red-team exercises that simulate real attacks.", controls: [OPS-03]}
  # ---- Respond ----
  - {ref: "RS.1", section: "Respond", title: "Incident response plan and reporting", guidance: "Keep an incident response plan with SOPs and report cyber incidents to SEBI through its portal and to CERT-In within 6 hours.", controls: [INC-01, INC-02]}
  - {ref: "RS.2", section: "Respond", title: "Root cause analysis and forensics", guidance: "Perform root cause analysis after incidents, and forensic analysis when the cause is unclear.", controls: [INC-04, INC-05]}
  - {ref: "RS.3", section: "Respond", title: "Cyber Crisis Management Plan", guidance: "Keep an up-to-date Cyber Crisis Management Plan and test it.", controls: [INC-01, BCP-01]}
  # ---- Recover ----
  - {ref: "RC.1", section: "Recover", title: "Recovery plan, backups and DR drills", guidance: "Document recovery plans with RTO and RPO for critical systems, keep tested backups, and run DR drills.", controls: [BCP-01, OPS-06, OPS-07]}
  # ---- Evolve and assurance ----
  - {ref: "EV.1", section: "Evolve and assurance", title: "Cyber audit by a CERT-In empanelled auditor", guidance: "Get periodic cyber audits from a CERT-In empanelled IS audit organisation and submit compliance reports to the relevant authority.", controls: [GOV-13, GOV-11]}
  - {ref: "EV.2", section: "Evolve and assurance", title: "Cyber Capability Index", guidance: "MIIs and Qualified REs measure their cyber resilience with the Cyber Capability Index, self-assessed and third-party assessed on the prescribed schedule.", controls: [GOV-14, GOV-13]}
  - {ref: "EV.3", section: "Evolve and assurance", title: "Lessons learned and continual improvement", guidance: "Feed incidents, audits and threat intelligence back into the programme.", controls: [GOV-15, RISK-05]}
