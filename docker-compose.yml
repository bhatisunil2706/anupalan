# Local / single-server setup. For production, put a TLS reverse proxy in front of `web`,
# set strong secrets in .env, and set COOKIE_SECURE=true.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment: &backend-env
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:-app}@db:5432/app
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-q8B2o0p7ihyc7m0Kp0b2xH4bW8mE5Sgo3JpS5qYz2Xw=}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: '["${PUBLIC_URL:-http://localhost:3000}"]'
      STORAGE_DIR: /app/storage
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Email (optional). Without SMTP_HOST, emails are written to the worker log instead.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Anupalan <no-reply@localhost>}
    volumes:
      - evidence:/app/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes:
      - evidence:/app/storage
    depends_on:
      - backend

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  evidence:
