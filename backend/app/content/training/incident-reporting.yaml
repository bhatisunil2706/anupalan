slug: incident-reporting
audience: Everyone
category: Foundations
order: 6
title: Spotting and reporting security incidents
minutes: 7
pass_mark: 80
control_codes: [HR-03, HR-07, INC-01]
summary: What counts as a security incident, why minutes matter (CERT-In's 6-hour rule), and exactly how to report one, even if you caused it.
body_md: |
  ## What is a security incident?

  Anything that could put our systems or data at risk. Report it even if you're not sure. Examples:

  - You clicked a link or opened an attachment that now seems suspicious, or entered your password on a strange page.
  - A laptop, phone or ID card is lost or stolen.
  - Customer or employee data was sent to the wrong person, or shared by mistake.
  - You see unusual activity: unknown logins, new admin accounts, files you didn't change, pop-ups or ransom notes.
  - Someone asks for confidential information in a way that feels wrong.

  ## Why speed matters

  Under the **CERT-In Directions**, many cyber incidents must be reported to the government within **6 hours** of
  being noticed. Personal data breaches must be reported to the Data Protection Board under **DPDP**. We can only
  meet these deadlines if you tell us straight away. A five-minute report can stop a small mistake from becoming a
  major breach.

  ## How to report

  1. **Tell the security team immediately** through the security channel or email listed on the intranet. For a lost
     device, also call IT so they can lock it remotely.
  2. **Say what happened, when, and what you've done since.** Screenshots help.
  3. **Don't try to investigate or clean up yourself.** Don't delete emails, turn off machines or "fix" things:
     you may destroy evidence. Disconnect from Wi-Fi only if asked.
  4. **Keep it confidential** until the security team says otherwise.

  ## No blame for reporting

  People who report quickly, including about their own mistakes, are never punished for the mistake. Hiding an
  incident is what causes real damage.
quiz:
  - q: You entered your password on a page that turned out to be fake. What first?
    options: ["Wait and see", "Report it to security now and change your password", "Clear your browser history", "Tell only your manager next week"]
    answer: 1
    explain: Report immediately so the account can be secured; change your password too.
  - q: Why does the time you take to report matter?
    options: ["It doesn't", "Some incidents must be reported to CERT-In within 6 hours of being noticed", "Reports are only read monthly", "Only for incidents over Rs 1 lakh"]
    answer: 1
    explain: The company's legal clock starts when anyone notices the incident.
  - q: You accidentally emailed a customer list to the wrong external address. What do you do?
    options: ["Nothing, it was an accident", "Report it to security straight away, with details", "Ask the recipient to delete it and tell no one", "Delete the sent email"]
    answer: 1
    explain: It may be a personal data breach with legal deadlines. Report it, and don't hide it.
  - q: Your laptop shows a ransom note. What should you avoid?
    options: ["Reporting it", "Trying to fix it yourself or deleting files", "Calling IT", "Taking a photo of the screen"]
    answer: 1
    explain: Self-repair destroys evidence and can spread damage. Report and follow instructions.
  - q: What happens if you report an incident you caused by mistake?
    options: ["You're automatically disciplined", "You're thanked; fast reporting is never punished", "It goes on your appraisal", "You must pay for the damage"]
    answer: 1
    explain: Quick reporting limits damage. Hiding incidents is what causes harm.
