# ISO/IEC 42001:2023 Artificial intelligence management system. Clause and Annex A identifiers with in-house guidance.
# The ISO standard text is copyrighted and is NOT reproduced. Customers need their own copy of the standard.
# CONTENT STATUS: draft. Review by an ISO 42001 Lead Auditor before customer release.
code: iso42001
name: ISO/IEC 42001:2023 (AI management system)
short_name: ISO 42001
version: "2023"
region: Global
publisher: ISO/IEC
source_url: https://www.iso.org/standard/81230.html
content_version: "0.1.0"
review_status: draft
description: >
  Certifiable standard for managing AI responsibly, for organisations that build, provide or use AI
  systems. Shares its management system structure with ISO 27001, so most governance controls carry
  over; the AI-specific controls cover impact assessment, data, lifecycle, transparency and suppliers.
requirements:
  # ---- Management system clauses ----
  - {ref: "4.1", section: "Clause 4 Context", title: "Organisation and its context, including its AI role", guidance: "Record internal and external issues and whether you are an AI developer, provider, user or several.", controls: [GOV-02, AI-01]}
  - {ref: "4.2", section: "Clause 4 Context", title: "Needs of interested parties", guidance: "Identify users, affected people, customers and regulators and their AI-related requirements.", controls: [GOV-02]}
  - {ref: "4.3", section: "Clause 4 Context", title: "AI management system scope", guidance: "Document which AI systems, teams and activities are in scope.", controls: [GOV-02, AI-01]}
  - {ref: "4.4", section: "Clause 4 Context", title: "AI management system", guidance: "Establish, run and improve the AI management system and its processes.", controls: [AI-01]}
  - {ref: "5.1", section: "Clause 5 Leadership", title: "Leadership and commitment", guidance: "Top management approves the AI policy and objectives and provides resources.", controls: [GOV-03, AI-01]}
  - {ref: "5.2", section: "Clause 5 Leadership", title: "AI policy", guidance: "Publish an AI policy that fits your purpose and commits to meeting requirements and improving.", controls: [AI-01]}
  - {ref: "5.3", section: "Clause 5 Leadership", title: "Roles, responsibilities and authorities", guidance: "Assign responsibility for the AI management system and its reporting.", controls: [AI-01, GOV-04]}
  - {ref: "6.1.1", section: "Clause 6 Planning", title: "Actions to address risks and opportunities", guidance: "Plan how the AI management system addresses its risks and opportunities.", controls: [RISK-01, AI-02]}
  - {ref: "6.1.2", section: "Clause 6 Planning", title: "AI risk assessment", guidance: "Define and apply an AI risk assessment process with criteria for acceptable risk.", controls: [AI-02]}
  - {ref: "6.1.3", section: "Clause 6 Planning", title: "AI risk treatment", guidance: "Choose treatments, compare against Annex A, and produce a Statement of Applicability.", controls: [AI-02, RISK-02]}
  - {ref: "6.1.4", section: "Clause 6 Planning", title: "AI system impact assessment", guidance: "Define how you assess consequences of AI systems for individuals, groups and society.", controls: [AI-02]}
  - {ref: "6.2", section: "Clause 6 Planning", title: "AI objectives", guidance: "Set measurable AI objectives with owners and deadlines.", controls: [GOV-06, AI-01]}
  - {ref: "6.3", section: "Clause 6 Planning", title: "Planning of changes", guidance: "Change the AI management system in a planned way.", controls: [GOV-06]}
  - {ref: "7.1", section: "Clause 7 Support", title: "Resources", guidance: "Provide people, data, tools and compute for the AI management system.", controls: [GOV-06]}
  - {ref: "7.2", section: "Clause 7 Support", title: "Competence", guidance: "Define and evidence competence for people working on AI systems.", controls: [GOV-17]}
  - {ref: "7.3", section: "Clause 7 Support", title: "Awareness", guidance: "Staff know the AI policy and their part in responsible AI.", controls: [HR-03, AI-06]}
  - {ref: "7.4", section: "Clause 7 Support", title: "Communication", guidance: "Decide what to communicate about AI, to whom and when.", controls: [GOV-09, AI-05]}
  - {ref: "7.5", section: "Clause 7 Support", title: "Documented information", guidance: "Create, control and keep the documents the AI management system needs.", controls: [GOV-07]}
  - {ref: "8.1", section: "Clause 8 Operation", title: "Operational planning and control", guidance: "Plan and control the processes for AI systems, including outsourced ones.", controls: [AI-03, GOV-06]}
  - {ref: "8.2", section: "Clause 8 Operation", title: "AI risk assessment (performed)", guidance: "Run AI risk assessments at planned intervals and on significant change.", controls: [AI-02]}
  - {ref: "8.3", section: "Clause 8 Operation", title: "AI risk treatment (performed)", guidance: "Implement the AI risk treatment plan and check it works.", controls: [AI-02]}
  - {ref: "8.4", section: "Clause 8 Operation", title: "AI system impact assessment (performed)", guidance: "Carry out impact assessments and keep the results.", controls: [AI-02]}
  - {ref: "9.1", section: "Clause 9 Performance evaluation", title: "Monitoring, measurement, analysis and evaluation", guidance: "Measure how the AI management system and AI systems perform.", controls: [GOV-14, AI-03]}
  - {ref: "9.2", section: "Clause 9 Performance evaluation", title: "Internal audit", guidance: "Audit the AI management system at planned intervals.", controls: [GOV-13]}
  - {ref: "9.3", section: "Clause 9 Performance evaluation", title: "Management review", guidance: "Top management reviews the AI management system and records decisions.", controls: [GOV-03]}
  - {ref: "10.1", section: "Clause 10 Improvement", title: "Continual improvement", guidance: "Keep improving the AI management system.", controls: [GOV-15]}
  - {ref: "10.2", section: "Clause 10 Improvement", title: "Nonconformity and corrective action", guidance: "Fix nonconformities, find root causes and keep records.", controls: [GOV-15]}
  # ---- Annex A controls ----
  - {ref: "A.2.2", section: "A.2 Policies related to AI", title: "AI policy", guidance: "Document a policy for developing or using AI systems.", controls: [AI-01]}
  - {ref: "A.2.3", section: "A.2 Policies related to AI", title: "Alignment with other policies", guidance: "Check how other policies (security, privacy, quality) apply to AI and align them.", controls: [AI-01, GOV-01]}
  - {ref: "A.2.4", section: "A.2 Policies related to AI", title: "Review of the AI policy", guidance: "Review the AI policy at planned intervals.", controls: [AI-01]}
  - {ref: "A.3.2", section: "A.3 Internal organisation", title: "AI roles and responsibilities", guidance: "Define and allocate roles for AI across its lifecycle.", controls: [AI-01, GOV-04]}
  - {ref: "A.3.3", section: "A.3 Internal organisation", title: "Reporting of concerns", guidance: "Give people a way to raise concerns about AI systems, protected from retaliation.", controls: [AI-01, HR-07]}
  - {ref: "A.4.2", section: "A.4 Resources for AI systems", title: "Resource documentation", guidance: "Identify and document the resources each AI system needs.", controls: [AI-01]}
  - {ref: "A.4.3", section: "A.4 Resources for AI systems", title: "Data resources", guidance: "Document the data used by AI systems.", controls: [AI-04]}
  - {ref: "A.4.4", section: "A.4 Resources for AI systems", title: "Tooling resources", guidance: "Document the tools, libraries and models used.", controls: [AI-01, AST-01]}
  - {ref: "A.4.5", section: "A.4 Resources for AI systems", title: "System and computing resources", guidance: "Document compute and infrastructure for AI systems.", controls: [AI-01, AST-01]}
  - {ref: "A.4.6", section: "A.4 Resources for AI systems", title: "Human resources", guidance: "Document the people and competences AI systems need.", controls: [GOV-17]}
  - {ref: "A.5.2", section: "A.5 Assessing impacts of AI systems", title: "Impact assessment process", guidance: "Define a process to assess potential consequences of AI systems.", controls: [AI-02]}
  - {ref: "A.5.3", section: "A.5 Assessing impacts of AI systems", title: "Documentation of impact assessments", guidance: "Record and keep impact assessment results.", controls: [AI-02]}
  - {ref: "A.5.4", section: "A.5 Assessing impacts of AI systems", title: "Impact on individuals or groups", guidance: "Assess effects on individuals and groups, including fairness and access.", controls: [AI-02]}
  - {ref: "A.5.5", section: "A.5 Assessing impacts of AI systems", title: "Societal impacts", guidance: "Assess wider societal effects.", controls: [AI-02]}
  - {ref: "A.6.1.2", section: "A.6 AI system life cycle", title: "Objectives for responsible development", guidance: "Set objectives for responsible development and build them into the lifecycle.", controls: [AI-03, AI-01]}
  - {ref: "A.6.1.3", section: "A.6 AI system life cycle", title: "Processes for responsible design and development", guidance: "Define processes for responsible design and development.", controls: [AI-03, SDL-01]}
  - {ref: "A.6.2.2", section: "A.6 AI system life cycle", title: "Requirements and specification", guidance: "Specify requirements for new AI systems or major changes.", controls: [AI-03]}
  - {ref: "A.6.2.3", section: "A.6 AI system life cycle", title: "Design and development documentation", guidance: "Document design and development decisions.", controls: [AI-03]}
  - {ref: "A.6.2.4", section: "A.6 AI system life cycle", title: "Verification and validation", guidance: "Define and run verification and validation against acceptance criteria.", controls: [AI-03]}
  - {ref: "A.6.2.5", section: "A.6 AI system life cycle", title: "Deployment", guidance: "Plan deployment and confirm requirements are met first.", controls: [AI-03, SDL-05]}
  - {ref: "A.6.2.6", section: "A.6 AI system life cycle", title: "Operation and monitoring", guidance: "Monitor AI systems in operation, including performance and drift, and handle failures.", controls: [AI-03, LOG-02]}
  - {ref: "A.6.2.7", section: "A.6 AI system life cycle", title: "Technical documentation", guidance: "Provide technical documentation to the people who need it.", controls: [AI-03, AI-05]}
  - {ref: "A.6.2.8", section: "A.6 AI system life cycle", title: "Event logs", guidance: "Decide what events AI systems log and keep the logs.", controls: [AI-03, LOG-01]}
  - {ref: "A.7.2", section: "A.7 Data for AI systems", title: "Data for development and enhancement", guidance: "Define data management processes for developing AI systems.", controls: [AI-04]}
  - {ref: "A.7.3", section: "A.7 Data for AI systems", title: "Acquisition of data", guidance: "Record how and from where data is acquired and the right to use it.", controls: [AI-04]}
  - {ref: "A.7.4", section: "A.7 Data for AI systems", title: "Quality of data", guidance: "Define and check data quality requirements.", controls: [AI-04]}
  - {ref: "A.7.5", section: "A.7 Data for AI systems", title: "Data provenance", guidance: "Record data provenance across its lifecycle.", controls: [AI-04]}
  - {ref: "A.7.6", section: "A.7 Data for AI systems", title: "Data preparation", guidance: "Define and record data preparation methods.", controls: [AI-04]}
  - {ref: "A.8.2", section: "A.8 Information for interested parties", title: "System documentation and information for users", guidance: "Give users the information they need about the AI system.", controls: [AI-05]}
  - {ref: "A.8.3", section: "A.8 Information for interested parties", title: "External reporting", guidance: "Let interested parties report adverse impacts of the AI system.", controls: [AI-05]}
  - {ref: "A.8.4", section: "A.8 Information for interested parties", title: "Communication of incidents", guidance: "Plan how to tell users about AI incidents.", controls: [AI-05, INC-01]}
  - {ref: "A.8.5", section: "A.8 Information for interested parties", title: "Information for interested parties", guidance: "Decide what AI information to share with regulators and others.", controls: [AI-05]}
  - {ref: "A.9.2", section: "A.9 Use of AI systems", title: "Processes for responsible use", guidance: "Define how AI systems are used responsibly.", controls: [AI-06]}
  - {ref: "A.9.3", section: "A.9 Use of AI systems", title: "Objectives for responsible use", guidance: "Set objectives that guide responsible use.", controls: [AI-06]}
  - {ref: "A.9.4", section: "A.9 Use of AI systems", title: "Intended use", guidance: "Use AI systems as intended and documented.", controls: [AI-06, AI-05]}
  - {ref: "A.10.2", section: "A.10 Third-party and customer relationships", title: "Allocating responsibilities", guidance: "Allocate AI responsibilities between you, partners, suppliers and customers.", controls: [AI-06, VEN-02]}
  - {ref: "A.10.3", section: "A.10 Third-party and customer relationships", title: "Suppliers", guidance: "Make sure AI suppliers' services and models align with your responsible AI approach.", controls: [AI-06, VEN-01]}
  - {ref: "A.10.4", section: "A.10 Third-party and customer relationships", title: "Customers", guidance: "Take customer expectations and needs into account for AI systems you provide.", controls: [AI-06, AI-05]}
