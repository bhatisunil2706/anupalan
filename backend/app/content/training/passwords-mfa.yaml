slug: passwords-mfa
audience: Everyone
category: Foundations
order: 4
title: Passwords, MFA and keeping your accounts safe
minutes: 8
pass_mark: 80
control_codes: [HR-03, ACC-03, ACC-08]
summary: Why stolen passwords cause most breaches, how a password manager and MFA stop them, and what MFA fatigue attacks look like.
body_md: |
  ## Why this matters

  Most breaches start with a stolen or guessed password. Attackers buy passwords leaked from other websites and try
  them on work accounts ("credential stuffing"). If you reuse a password anywhere, one breach elsewhere can open your
  work email.

  ## Good passwords, without the pain

  - **Use a password manager.** It creates and remembers a different strong password for every account. You only
    remember one long passphrase for the manager itself.
  - **Long beats complex.** Four or five random words (`river-saffron-ladder-tiger`) are stronger and easier to type
    than `P@ssw0rd!`.
  - **Never reuse** a work password on any other site, and never share it, not even with IT.
  - **Change it immediately** if you think it was exposed, and tell the security team.

  ## Multi-factor authentication (MFA)

  MFA means a password alone isn't enough: you also approve a prompt, type a code or touch a security key. It blocks
  the large majority of account takeover attempts.

  - Prefer an **authenticator app or security key** over SMS codes, which can be stolen through SIM swaps.
  - Keep your **recovery codes** somewhere safe, such as your password manager.

  ## MFA fatigue and OTP theft

  Attackers who already have your password may send push prompt after push prompt, hoping you approve one to make
  them stop, or call you pretending to be IT and ask you to read out a code.

  - **Never approve a prompt you didn't start.** Deny it and report it: it means someone has your password.
  - **Never share an OTP or code** with anyone, whatever they claim. No real IT team or bank will ask for it.
quiz:
  - q: Your phone shows an MFA approval request but you aren't signing in to anything. What should you do?
    options: ["Approve it so it stops", "Deny it, change your password and report it", "Ignore it", "Approve it and check later"]
    answer: 1
    explain: An unexpected prompt means someone already has your password. Deny, change the password and tell security.
  - q: Which is the strongest password approach?
    options: ["The same strong password everywhere", "A password manager with a unique password per site", "Your name plus your birth year", "Changing one character each month"]
    answer: 1
    explain: Unique passwords mean a leak on one site can't unlock your other accounts.
  - q: Someone from "IT" calls and asks you to read out the 6-digit code you just received. What do you do?
    options: ["Read it out, they're from IT", "Refuse, hang up and report the call", "Read out half of it", "Email it to them instead"]
    answer: 1
    explain: Codes are for you alone. Anyone asking for one is trying to take over your account.
  - q: Which MFA method is hardest for attackers to steal?
    options: ["SMS code", "Email code", "Security key or authenticator app", "Security question"]
    answer: 2
    explain: SMS can be stolen by SIM swap; security keys and authenticator apps are tied to your device.
  - q: You realise you used your work password on a shopping site that was just breached. What now?
    options: ["Nothing, it's a different site", "Change your work password now and tell the security team", "Wait to see if anything happens", "Delete the shopping account only"]
    answer: 1
    explain: Attackers try leaked passwords on work accounts within hours.
