name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Content checks
        run: python -m app.cli check-content
      - name: Tests
        run: pytest -q --timeout 120
      - name: Migrations match models
        run: |
          createdb -h localhost -U postgres app_migrations
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/app_migrations alembic upgrade head
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/app_migrations alembic check
        env:
          PGPASSWORD: postgres
      - name: Static analysis (bandit)
        run: bandit -q -r app -c pyproject.toml
      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  secrets-and-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build -t anupalan-backend backend
          docker build -t anupalan-web frontend
      - name: Image scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: anupalan-backend
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Config scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
